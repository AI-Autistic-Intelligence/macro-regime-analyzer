[project]
name = "macro-regime-analyzer"
version = "2.0.0"
description = "Enterprise Macroeconomic Regime Analyzer using Clean Architecture"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.4.0",
    "pydantic-settings>=2.0.0",
    "polars>=0.19.0",
    "duckdb>=0.9.0",
    "redis>=5.0.0",
    "fastapi>=0.103.0",
    "uvicorn>=0.23.0",
    "hmmlearn>=0.3.0",
    "scikit-learn>=1.3.0",
    "structlog>=23.1.0",
    "tenacity>=8.2.0",
    "apscheduler>=3.10.0",
    "websockets>=11.0.3",
    "prometheus-fastapi-instrumentator>=6.1.0",
    "aiokafka>=0.8.0",
    "torch>=2.0.0",
    "shap>=0.44.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pandera[polars]>=0.18.0",
    "ruff>=0.3.0",
    "mlflow>=2.10.0",
    "feast>=0.34.0",
    "celery>=5.3.6",
    "pika>=1.3.2",
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "hypothesis>=6.82.0",
    "ruff>=0.0.287",
    "mypy>=1.5.0",
    "httpx>=0.25.0"
]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
ignore_missing_imports = true
